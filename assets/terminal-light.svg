<svg xmlns="http://www.w3.org/2000/svg" width="880" height="456" viewBox="0 0 880 456" role="img" aria-label="Animated terminal introducing Nethmin Dulsara">
  <title>nethmin@platform — zsh</title>

  <!-- window -->
  <rect x="1" y="1" width="878" height="454" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="1" y1="44" x2="879" y2="44" stroke="#d0d7de" stroke-width="1"/>

  <!-- traffic lights + title -->
  <circle cx="26" cy="23" r="6.5" fill="#ff5f56"/>
  <circle cx="48" cy="23" r="6.5" fill="#ffbd2e"/>
  <circle cx="70" cy="23" r="6.5" fill="#27c93f"/>
  <text x="440" y="28" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="13" fill="#656d76">nethmin@platform — zsh</text>

  <!-- typing clips -->
  <defs>
    <clipPath id="c1"><rect x="28" y="59" width="0" height="22"><animate attributeName="width" from="0" to="110" begin="0.5s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="28" y="125" width="0" height="22"><animate attributeName="width" from="0" to="300" begin="2s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="28" y="279" width="0" height="22"><animate attributeName="width" from="0" to="240" begin="4.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="28" y="345" width="0" height="22"><animate attributeName="width" from="0" to="200" begin="6.7s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" xml:space="preserve">

    <!-- ~ ❯ whoami -->
    <g clip-path="url(#c1)">
      <text x="28" y="76"><tspan fill="#0969da">~</tspan><tspan fill="#8250df"> ❯ </tspan><tspan fill="#1a7f37">whoami</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/>
      <text x="28" y="98"><tspan fill="#1f2328" font-weight="600">Nethmin Dulsara</tspan><tspan fill="#656d76"> — Software Engineer · Backend &amp; Platform</tspan></text>
    </g>

    <!-- ~ ❯ kubectl get pods -n expertise -->
    <g clip-path="url(#c2)">
      <text x="28" y="142"><tspan fill="#0969da">~</tspan><tspan fill="#8250df"> ❯ </tspan><tspan fill="#1a7f37">kubectl</tspan><tspan fill="#1f2328"> get pods</tspan><tspan fill="#0969da"> -n</tspan><tspan fill="#1f2328"> expertise</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/>
      <text y="164" fill="#656d76"><tspan x="28">NAME</tspan><tspan x="248">READY</tspan><tspan x="318">STATUS</tspan><tspan x="408">AGE</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.65s" fill="freeze"/>
      <text y="186"><tspan x="28" fill="#1f2328">go</tspan><tspan x="248" fill="#1f2328">1/1</tspan><tspan x="318" fill="#1a7f37">Running</tspan><tspan x="408" fill="#656d76">4y</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.8s" fill="freeze"/>
      <text y="208"><tspan x="28" fill="#1f2328">kubernetes</tspan><tspan x="248" fill="#1f2328">1/1</tspan><tspan x="318" fill="#1a7f37">Running</tspan><tspan x="408" fill="#656d76">3y</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.95s" fill="freeze"/>
      <text y="230"><tspan x="28" fill="#1f2328">aws-architecture</tspan><tspan x="248" fill="#1f2328">1/1</tspan><tspan x="318" fill="#1a7f37">Running</tspan><tspan x="408" fill="#656d76">3y</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/>
      <text y="252"><tspan x="28" fill="#1f2328">distributed-messaging</tspan><tspan x="248" fill="#1f2328">1/1</tspan><tspan x="318" fill="#1a7f37">Running</tspan><tspan x="408" fill="#656d76">2y</tspan></text>
    </g>

    <!-- ~ ❯ cat certifications.txt -->
    <g clip-path="url(#c3)">
      <text x="28" y="296"><tspan fill="#0969da">~</tspan><tspan fill="#8250df"> ❯ </tspan><tspan fill="#1a7f37">cat</tspan><tspan fill="#1f2328"> certifications.txt</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/>
      <text x="28" y="318"><tspan fill="#1a7f37">✔ </tspan><tspan fill="#bc4c00">AWS Certified Solutions Architect — Associate</tspan></text>
    </g>

    <!-- ~ ❯ cat education.txt -->
    <g clip-path="url(#c4)">
      <text x="28" y="362"><tspan fill="#0969da">~</tspan><tspan fill="#8250df"> ❯ </tspan><tspan fill="#1a7f37">cat</tspan><tspan fill="#1f2328"> education.txt</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/>
      <text x="28" y="384"><tspan fill="#0969da">» </tspan><tspan fill="#8250df">MSc Data Science &amp; AI</tspan><tspan fill="#656d76"> — University of Moratuwa</tspan></text>
    </g>

    <!-- idle prompt + blinking cursor -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="8.4s" fill="freeze"/>
      <text x="28" y="428"><tspan fill="#0969da">~</tspan><tspan fill="#8250df"> ❯ </tspan></text>
      <rect x="62" y="415" width="9" height="17" fill="#1a7f37">
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" begin="8.4s" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
