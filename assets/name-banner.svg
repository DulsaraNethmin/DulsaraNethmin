<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" role="img" aria-label="Nethmin Dulsara">
  <title>Nethmin Dulsara</title>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <text x="440" y="66" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="1" fill="url(#flow)">Nethmin Dulsara</text>
  <text x="440" y="92" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="13" letter-spacing="6" fill="#8b95a1">SOFTWARE ENGINEER · SRI LANKA</text>
</svg>
